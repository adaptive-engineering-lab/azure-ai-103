<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="%APP_DESCRIPTION%" />
    <title>%APP_NAME%</title>
    <script>
      // FOUC-free theme apply. Runs synchronously before the React bundle
      // parses, so it cannot import the namespace module. The key is injected
      // at build time from STATE_KEY by the branded-html plugin in
      // vite.config.ts, so it cannot drift.
      (function () {
        try {
          var raw = localStorage.getItem('%STORAGE_STATE_KEY%');
          var theme = 'dark';
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.preferences && (parsed.preferences.theme === 'light' || parsed.preferences.theme === 'dark')) {
              theme = parsed.preferences.theme;
            }
          }
          document.documentElement.classList.add(theme);
          document.documentElement.style.colorScheme = theme;
        } catch (_) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        }
      })();
    </script>
  </head>
  <body class="bg-bg text-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
